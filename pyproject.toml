[project]
name = "dftscape-dxtb"
version = "0.1.0"
description = "Add your description here"
readme = "README"
requires-python = ">=3.12"
dependencies = [
    "dxtb[libcint]",
    "hydra-core>=1.3.2",
    "jupyter>=1.1.1",
    "networkx>=3.5",
    "numpy>=1.16",
    "pdoc>=15.0.4",
    "py3dmol>=2.5.2",
    "pytest>=8.4.1",
    "rdkit>=2025.3.6",
    "rmsd>=1.6.4",
    "ruff>=0.13.0",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short"
]

# Selectively filter warnings - only silence pkg_resources deprecation from psi4
filterwarnings = [
    "ignore:pkg_resources is deprecated:UserWarning",
    "ignore:.*pkg_resources.*:DeprecationWarning"
]
